name: Auto Release from Manifest

# Runs after a green Tests run on main; a no-op while the manifest version is
# already tagged, so a release missed by a red run is picked up by the next one.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Only proceed when triggered manually OR when the upstream Tests
    # workflow concluded successfully.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Explicit, so manual dispatch and reruns behave predictably.
          ref: main
          fetch-depth: 0

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/mypv/manifest.json)
          echo "Version found: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # A letter in the version (1.7.7b1) marks a pre-release, which HACS
          # only offers to users who opted into betas.
          if echo "$VERSION" | grep -qE '[a-zA-Z]'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists. Skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract Release Notes
        if: steps.check_tag.outputs.exists == 'false'
        id: extract_release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # From the "## VERSION" header to the next "## " one.
          # Anchored, or "## v1.2.3" would also match its own "## v1.2.3b1" betas.
          VER_RE=$(echo "$VERSION" | sed 's/\./\\./g')
          awk -v ver="$VER_RE" '$0 ~ "^## v?" ver "$" {flag=1; next} /^## /{flag=0} flag' changelog.md > release_notes.md

          # Fallback if the version isn't in the changelog yet.
          if [ ! -s release_notes.md ]; then
            echo "Release v$VERSION" > release_notes.md
          fi

      # ``gh``, not softprops/action-gh-release: this repo allows only selected
      # actions, and a third-party one fails the run before its first step.
      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --notes-file release_notes.md \
            --target main \
            $PRERELEASE
